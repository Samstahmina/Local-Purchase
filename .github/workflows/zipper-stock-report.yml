name: Zipper Stock Report

on:
  # Every 30 minutes during Dhaka working hours. Cron is UTC and Dhaka is
  # UTC+6, so 02:00-16:30 UTC covers 08:00-22:30 local. GitHub queues
  # scheduled runs on shared infrastructure, so expect some minutes of drift.
  schedule:
    - cron: "*/30 2-16 * * *"
  workflow_dispatch:

# Never let two runs overlap. Each one regenerates the shared
# stock.opening.closing table in Odoo and rewrites the whole sheet, so a
# second run starting mid-write would corrupt the output. Queue instead of
# cancelling, so an in-flight run is always allowed to finish its write.
concurrency:
  group: zipper-stock-report
  cancel-in-progress: false

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run stock report script
        env:
          ODOO_DB: ${{ secrets.ODOO_DB }}
          ODOO_USERNAME: ${{ secrets.ODOO_USERNAME }}
          ODOO_PASSWORD: ${{ secrets.ODOO_PASSWORD }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDS }}
        run: python "scripts/Zipper Stock Report.py"
